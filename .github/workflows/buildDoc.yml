name: Build LaTeX PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch para compilar o PDF (pre-release)"
        required: true
        default: "stable"

jobs:
  build_latex:
    runs-on: ubuntu-latest

    steps:
      # ===============================
      # CHECKOUT
      # ===============================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch || github.ref_name }}

      # ===============================
      # BUILD LATEX
      # ===============================
      - name: Install LaTeX and Pygments
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full latexmk python3-pygments

      - name: Compile LaTeX
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -shell-escape main.tex

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcc-pdf
          path: main.pdf

      # ===============================
      # RELEASE ESTÁVEL (LATEST)
      # ===============================
      - name: Publish Stable Release (latest)
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TCC [PDF] (Stable)
          body: |
            PDF do TCC gerado automaticamente a partir do commit ${{ github.sha }}
            Corresponde à última versão **estável** do documento.
          files: main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.Publish_Release }}

      # ===============================
      # PRÉ-RELEASE MANUAL
      # ===============================
      - name: Publish Pre-release (manual)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pre-release-${{ github.event.inputs.target_branch }}
          name: TCC [PDF] (Pré-release - ${{ github.event.inputs.target_branch }})
          body: |
            PDF do TCC gerado **manualmente** a partir da branch **${{ github.event.inputs.target_branch }}**.
            Commit: ${{ github.sha }}
          prerelease: true
          files: main.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.Publish_Release }}
