name: Build LaTeX PDF

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch para compilar o PDF"
        required: true
        default: "main"

jobs:
  build_latex:
    runs-on: ubuntu-latest
    if: github.ref_name == inputs.target_branch   

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-full latexmk

      - name: Compile LaTeX
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tcc-pdf
          path: main.pdf
